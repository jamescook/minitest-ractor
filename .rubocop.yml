plugins:
  - rubocop-performance
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'tmp/**/*'
    - 'vendor/**/*'
    - 'probes/**/*' # standalone experiments, deliberately written to read as prose

# Complexity metrics are subjective and push toward harder-to-read code.
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false

Style/Documentation:
  Enabled: false

# Minitest itself is written in double quotes, and so is the code this gem sits next to.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: true
  Exclude:
    - 'test/**/*'

Layout/LineLength:
  Max: 100
  Exclude:
    - 'test/**/*'
    - '*.gemspec'
  AllowedPatterns:
    - '^\s*#'

Minitest/MultipleAssertions:
  Max: 10
